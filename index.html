:root{
  --pink:#F5C8E7; --pink-d:#E7AED6;
  --blue:#5C9BF6; --mint:#CDF7CC; --sun:#F6C56A; --orange:#EE5B3B;
  --ink:#0E0E0E; --mute:#D3CACF; --paper:#FFFFFF;
  --r-red:#EE3B2B; --r-yel:#F5B700; --r-grn:#22B04B;
  --disp:"BSD", "Arial Narrow", Impact, sans-serif;
  --text:"IT", -apple-system, system-ui, sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--pink);color:var(--ink);font-family:var(--text);overscroll-behavior:none}
body{overflow:hidden;transition:background .35s}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.disp{font-family:var(--disp);text-transform:uppercase;font-weight:900;letter-spacing:.005em}

/* ---------- pager ---------- */
#pager{position:fixed;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-align:start;scroll-snap-stop:always;padding:calc(var(--st) + 14px) 18px calc(var(--sb) + 150px);position:relative}
.page::-webkit-scrollbar{display:none}
#p-acil{background:var(--pink)} #p-isler,#p-unutma,#p-fikir{background:var(--paper)}
.inner{max-width:520px;margin:0 auto}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;height:52px;margin-bottom:14px}
.logo{width:48px;height:48px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--pink-d)}
.logo img{width:100%;height:100%;display:block}
#p-isler .logo,#p-unutma .logo,#p-fikir .logo{background:#F3EEF1}
.dots{display:flex;gap:7px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--ink);opacity:.15}
.dots i.on{opacity:1}
.menu-btn{width:44px;height:44px;display:grid;place-items:center}
.menu-btn svg{width:22px;height:22px}

/* big titles */
.title{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:clamp(56px,18.5vw,88px);line-height:1;margin:4px 0 18px;letter-spacing:-.005em}
.title span{display:block}
.title .w{color:#fff}
.title .g{color:var(--mute)}
.title .o{color:var(--orange)}
.sub{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:18px;line-height:1.15;color:rgba(0,0,0,.32);letter-spacing:.02em}

/* ---------- hub stats ---------- */
.stats{margin:2px 0 18px}
.stats-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.next{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:18px;line-height:1.15;text-align:right;max-width:62%}
.next small{display:block;color:rgba(0,0,0,.32);font-size:16px;font-weight:800}
.next .sq{display:inline-flex;gap:4px;margin-top:6px}
.sq b{width:12px;height:12px;background:var(--ink);display:inline-block}
.sq b.off{background:rgba(255,255,255,.55)}
.bar{height:42px;display:flex;border-radius:14px;overflow:hidden;position:relative}
.bar .fill{background:var(--ink);border-radius:14px;min-width:14px;transition:width .5s}
.bar .hatch{flex:1;background:repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,transparent 2px 9px)}
.bar .mid{background:repeating-linear-gradient(90deg,#B98FAC 0 3px,#D7A9C8 3px 7px);transition:width .5s}
.nums{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:10px}
.nums b{display:block;font-family:var(--disp);font-weight:900;font-size:32px;line-height:1.05}
.nums span{font-size:13px;color:rgba(0,0,0,.42);font-weight:500;letter-spacing:.02em}

/* ---------- cards ---------- */
.stack{display:flex;flex-direction:column}
.card{position:relative;border-radius:22px 0 22px 22px;padding:13px 14px 13px;background:var(--pink);
  clip-path:polygon(0 0,calc(100% - 34px) 0,100% 34px,100% 100%,0 100%);cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.99)}
.card::after{content:"";position:absolute;top:0;right:0;width:34px;height:34px;background:rgba(255,255,255,.55);
  clip-path:polygon(0 0,0 100%,100% 100%);border-bottom-left-radius:8px}
.stack .card+.card{margin-top:-18px;padding-top:31px}
.stack .card:not(:last-child){padding-bottom:31px}
.card.c-dergi{background:var(--pink)} .card.c-kitap{background:var(--blue)} .card.c-tasarim{background:var(--mint)} .card.c-diger{background:var(--sun)}
.c-row{display:flex;align-items:flex-start;gap:11px;padding-right:22px}
.box{width:40px;height:40px;border:1.5px dashed rgba(0,0,0,.2);border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.box svg{width:21px;height:21px}
.c-body{flex:1;min-width:0;padding-top:1px}
.c-title{font-size:16.5px;font-weight:700;line-height:1.28;word-wrap:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-note{font-size:13.5px;line-height:1.3;color:rgba(0,0,0,.5);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-meta{display:flex;align-items:center;gap:10px;margin-top:10px;padding-left:51px}
.c-time{font-family:var(--disp);font-weight:900;font-size:26px;line-height:1;letter-spacing:.01em}
.c-time .mm,.mm{color:rgba(0,0,0,.28)}
.c-day{font-family:var(--disp);font-weight:800;font-size:15px;line-height:1;text-transform:uppercase;letter-spacing:.04em;color:rgba(0,0,0,.45)}
.lights{display:flex;gap:6px;margin-left:auto}
.lt{width:22px;height:22px;border-radius:50%;border:2px solid rgba(0,0,0,.22);display:block;position:relative;flex:0 0 auto}
.lt::before{content:"";position:absolute;inset:-8px -4px}
.lt.on.red{background:var(--r-red);border-color:var(--r-red)}
.lt.on.yellow{background:var(--r-yel);border-color:var(--r-yel)}
.lt.on.green{background:var(--r-grn);border-color:var(--r-grn)}
.lt.red{border-color:rgba(238,59,43,.55)} .lt.yellow{border-color:rgba(200,150,0,.5)} .lt.green{border-color:rgba(34,140,70,.45)}
.check{width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;background:rgba(255,255,255,.35);flex:0 0 auto;margin-top:4px}
.check svg{width:15px;height:15px;opacity:0}
.card.done{opacity:.55}
.card.done .check{background:var(--ink)} .card.done .check svg{opacity:1;stroke:#fff}
.card.done .c-title{text-decoration:line-through}

/* featured (hub) */
.feat{background:#fff;border-radius:24px 0 24px 24px;position:relative;overflow:hidden;margin-bottom:14px;
  clip-path:polygon(0 0,calc(100% - 40px) 0,100% 40px,100% 100%,0 100%)}
.feat::after{content:"";position:absolute;top:0;right:0;width:40px;height:40px;background:var(--pink-d);clip-path:polygon(0 0,0 100%,100% 100%);border-bottom-left-radius:9px}
.feat-in{padding:14px 15px 14px;cursor:pointer}
.feat-head{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:900;font-size:17px;line-height:1;color:#B9AEB4;text-transform:uppercase;letter-spacing:.03em;padding-right:30px}
.feat-head .tag{background:var(--r-red);color:#fff;border-radius:7px;padding:4px 7px 3px;font-size:14px;letter-spacing:.05em}
.feat-mid{display:flex;align-items:center;gap:12px;margin:12px 0 10px}
.feat-mid .box{width:48px;height:48px;border:0}
.feat-mid .box svg{width:24px;height:24px}
.feat-time{font-family:var(--disp);font-weight:900;font-size:52px;line-height:.9;letter-spacing:-.005em}
.feat-time .mm{color:var(--mute)}
.feat-title{font-size:19px;font-weight:700;line-height:1.28;word-wrap:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.feat-note{font-size:14px;line-height:1.3;color:rgba(0,0,0,.5);margin-top:3px}
.feat-go{display:block;width:100%;background:var(--orange);font-family:var(--disp);font-weight:900;font-size:20px;line-height:1;text-transform:uppercase;padding:14px 0 13px;letter-spacing:.03em}
.feat-go:active{filter:brightness(.92)}

.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px;font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:22px}
.sec span{color:rgba(0,0,0,.3)}
.sec button{font-size:16px;color:rgba(0,0,0,.45);font-weight:800;padding:6px 0}

.empty{border:2px dashed rgba(0,0,0,.18);border-radius:26px;padding:26px 20px;text-align:center}
.empty b{display:block;font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:30px;line-height:1.05}
.empty span{display:block;margin-top:8px;color:rgba(0,0,0,.5);font-size:15px;line-height:1.4}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 18px;padding:2px 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border-radius:999px;padding:10px 15px 9px;font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:18px;letter-spacing:.02em;background:#F2EDF0;display:flex;gap:7px;align-items:center}
.chip i{font-style:normal;opacity:.4}
.chip.on{background:var(--ink);color:#fff}
.chip.on i{opacity:.6}
.chip .sw{width:12px;height:12px;border-radius:4px;display:inline-block}
.hint{display:flex;align-items:center;gap:8px;font-size:13.5px;color:rgba(0,0,0,.5);margin:-6px 2px 16px;line-height:1.35}
.hint .lt{width:14px;height:14px;flex:0 0 auto;border-width:0}

/* unutma */
.today{display:flex;justify-content:space-between;align-items:flex-end;margin:-6px 2px 18px}
.today .sub{color:var(--ink)}
.prog{display:flex;gap:4px}
.prog b{width:14px;height:14px;background:var(--ink)} .prog b.off{background:#EDE6EA}
.frow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1.5px dashed #E4DDE1}
.ftime{font-family:var(--disp);font-weight:900;font-size:32px;line-height:1;min-width:70px;flex:0 0 auto}
.ftime.none{color:var(--mute)}
.ftime .mm{color:var(--mute)}
.ftext{flex:1;min-width:0;font-size:17px;font-weight:600;line-height:1.3;cursor:pointer;word-wrap:break-word}
.ftext small{display:flex;align-items:center;gap:4px;font-weight:500;font-size:12.5px;color:rgba(0,0,0,.42);margin-top:3px}
.fcheck{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);flex:0 0 auto;display:grid;place-items:center}
.fcheck svg{width:16px;height:16px;opacity:0}
.frow.done .fcheck{background:var(--ink)} .frow.done .fcheck svg{opacity:1;stroke:#fff}
.frow.done .ftext{text-decoration:line-through;color:rgba(0,0,0,.35)}
.frow.done .ftime{opacity:.35}
.frow.late .ftime{color:var(--orange)}
.oldbox{background:#FFF3EF;border-radius:22px;padding:4px 14px;margin-bottom:8px}
.oldbox .frow:last-child{border-bottom:0}

/* ideas */
.ideas{columns:2;column-gap:10px}
.idea{break-inside:avoid;border-radius:22px 0 22px 22px;padding:14px 14px 16px;margin-bottom:10px;position:relative;cursor:pointer;
  clip-path:polygon(0 0,calc(100% - 30px) 0,100% 30px,100% 100%,0 100%)}
.idea::after{content:"";position:absolute;top:0;right:0;width:30px;height:30px;background:rgba(255,255,255,.55);clip-path:polygon(0 0,0 100%,100% 100%);border-bottom-left-radius:6px}
.idea.c-dergi{background:var(--pink)} .idea.c-kitap{background:var(--blue)} .idea.c-tasarim{background:var(--mint)}
.idea-h{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:15px;letter-spacing:.05em;display:flex;align-items:center;gap:6px;opacity:.55;margin-bottom:8px}
.idea-h svg{width:15px;height:15px}
.idea p{margin:0;font-size:16px;font-weight:600;line-height:1.32;word-wrap:break-word;white-space:pre-wrap}
.idea p.big{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:24px;line-height:1.08}
.idea time{display:block;margin-top:10px;font-size:12px;color:rgba(0,0,0,.42);font-weight:500}

/* ---------- nav + fab ---------- */
#nav{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 10px);max-width:500px;margin:0 auto;height:62px;background:var(--ink);border-radius:22px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;gap:4px;z-index:20}
#nav button{border-radius:16px;color:#fff;font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:17px;letter-spacing:.03em;position:relative;opacity:.55;transition:all .2s}
#nav button.on{opacity:1;background:#fff;color:var(--ink)}
#nav button[data-p="0"].on{background:var(--pink)}
#nav .badge{position:absolute;top:5px;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--r-red);color:#fff;font-size:12px;line-height:18px;padding:0 5px;font-family:var(--text);font-weight:700;letter-spacing:0}
#nav .badge:empty{display:none}
#fab{position:fixed;right:max(18px,calc(50% - 250px + 6px));bottom:calc(var(--sb) + 86px);width:68px;height:68px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;z-index:21;box-shadow:0 10px 24px rgba(0,0,0,.25),0 0 0 5px rgba(255,255,255,.65);transition:transform .2s,background .2s}
#fab:active{transform:scale(.92)}
#fab svg{width:28px;height:28px}
#fab.orange{background:var(--orange)}

/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(14,14,14,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:30px 30px 0 0;z-index:41;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);max-height:92vh;max-height:92dvh;overflow-y:auto;padding:10px 18px calc(var(--sb) + 22px)}
#sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:#E4DDE1;margin:0 auto 14px}
.sh-title{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:40px;line-height:1;margin:4px 0 18px}
.sh-title span{color:var(--mute)}
.lbl{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:16px;letter-spacing:.06em;color:rgba(0,0,0,.4);margin:16px 0 8px}
.field{width:100%;border:2px solid #EEE7EB;background:#FBF8FA;border-radius:18px;padding:14px 15px;font-size:17px;font-weight:600;outline:none;resize:none}
.field:focus{border-color:var(--ink);background:#fff}
textarea.field{min-height:84px;line-height:1.35}
.row{display:flex;gap:8px}
.row>*{flex:1}
.opt{border-radius:16px;padding:14px 6px 12px;font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:6px;border:2.5px solid transparent;position:relative}
.opt svg{width:24px;height:24px}
.opt.c-dergi{background:var(--pink)} .opt.c-kitap{background:var(--blue)} .opt.c-tasarim{background:var(--mint)} .opt.c-diger{background:var(--sun)}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff}
.opt.big{padding:22px 6px 18px;font-size:22px}
.opt.big svg{width:32px;height:32px}
.pri{background:#F5F0F3}
.pri .lt{width:24px;height:24px}
.pri.on{background:#fff}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.tchip{border-radius:999px;padding:10px 14px 9px;background:#F2EDF0;font-family:var(--disp);font-weight:900;font-size:17px;text-transform:uppercase}
.tchip.on{background:var(--ink);color:#fff}
.toggle{display:flex;align-items:center;gap:12px;background:#FBF8FA;border:2px solid #EEE7EB;border-radius:18px;padding:12px 14px;margin-top:16px;cursor:pointer;width:100%;text-align:left}
.toggle .sw{width:50px;height:30px;border-radius:15px;background:#E1D9DE;position:relative;flex:0 0 auto;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on .sw{background:var(--r-grn)} .toggle.on .sw::after{transform:translateX(20px)}
.toggle b{display:block;font-size:15.5px}
.toggle small{display:block;font-size:12.5px;color:rgba(0,0,0,.45);margin-top:1px;line-height:1.3}
.btn{display:block;width:100%;border-radius:18px;padding:17px 0 16px;font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:24px;letter-spacing:.02em;background:var(--ink);color:#fff;margin-top:20px;text-align:center;text-decoration:none}
.btn:disabled{opacity:.25}
.btn.alt{background:#F2EDF0;color:var(--ink);margin-top:10px}
.btn.red{background:var(--orange);color:var(--ink)}
.btn.ghost{background:none;color:rgba(0,0,0,.45);margin-top:6px;font-size:19px}
.btns2{display:flex;gap:8px}.btns2 .btn{margin-top:10px}
.guide{counter-reset:s;margin:0;padding:0;list-style:none}
.guide li{counter-increment:s;position:relative;padding:12px 0 12px 46px;border-bottom:1.5px dashed #EEE7EB;font-size:15.5px;line-height:1.45}
.guide li::before{content:counter(s);position:absolute;left:0;top:10px;width:32px;height:32px;border-radius:50%;background:var(--pink);font-family:var(--disp);font-weight:900;font-size:19px;display:grid;place-items:center}
.guide code{background:#F2EDF0;border-radius:6px;padding:1px 6px;font-size:14px}
.guide b{font-weight:700}
.note{font-size:14px;line-height:1.45;color:rgba(0,0,0,.6);background:#FBF8FA;border-radius:16px;padding:12px 14px;margin-top:14px}
.menu-list button{display:flex;width:100%;align-items:center;justify-content:space-between;padding:17px 4px;border-bottom:1.5px dashed #EEE7EB;font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:24px;text-align:left}
.menu-list button span{font-family:var(--text);font-weight:500;font-size:13px;text-transform:none;color:rgba(0,0,0,.45);text-align:right;max-width:50%}

/* toast */
#toast{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translate(-50%,-140%);background:var(--ink);color:#fff;border-radius:18px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:14px;z-index:60;transition:transform .3s cubic-bezier(.2,.9,.25,1);font-family:var(--disp);font-weight:900;text-transform:uppercase;font-size:19px;letter-spacing:.02em;max-width:92vw;white-space:nowrap}
#toast.on{transform:translate(-50%,0)}
#toast .dot{width:12px;height:12px;border-radius:50%;background:var(--r-red);flex:0 0 auto}
#toast button{background:#fff;color:var(--ink);border-radius:10px;padding:6px 10px 5px;font-size:16px}
#toast button:empty{display:none}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.pop{animation:pop .35s}
@keyframes flyout{to{transform:translateX(30px);opacity:0}}
.leaving{animation:flyout .3s forwards}
</style>
</head>
<body>

<main id="pager">
  <!-- ACİL MERKEZİ -->
  <section class="page" id="p-acil" data-i="0"><div class="inner">
    <div class="topbar"><button class="logo" data-act="menu" aria-label="Menü"><img src="apple-touch-icon.png" alt=""></button><div class="dots"><i class="on"></i><i></i><i></i><i></i></div><button class="menu-btn" data-act="menu" aria-label="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="#0E0E0E" stroke-width="2.4" stroke-linecap="round"><path d="M5 9l7 7 7-7"/></svg></button></div>
    <h1 class="title"><span>Acil</span><span class="w">Merkez</span></h1>
    <div id="hub"></div>
  </div></section>

  <!-- İŞLER -->
  <section class="page" id="p-isler" data-i="1"><div class="inner">
    <div class="topbar"><button class="logo" data-act="menu" aria-label="Menü"><img src="apple-touch-icon.png" alt=""></button><div class="dots"><i></i><i class="on"></i><i></i><i></i></div><button class="menu-btn" data-act="menu" aria-label="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="#0E0E0E" stroke-width="2.4" stroke-linecap="round"><path d="M5 9l7 7 7-7"/></svg></button></div>
    <h1 class="title"><span>İşler</span><span class="g">Güçler</span></h1>
    <div class="chips" id="catChips"></div>
    <div class="hint"><span class="lt on red"></span>Kırmızıya bas, iş Acil Merkez'e gitsin.</div>
    <div id="tasks"></div>
  </div></section>

  <!-- UNUTMA -->
  <section class="page" id="p-unutma" data-i="2"><div class="inner">
    <div class="topbar"><button class="logo" data-act="menu" aria-label="Menü"><img src="apple-touch-icon.png" alt=""></button><div class="dots"><i></i><i></i><i class="on"></i><i></i></div><button class="menu-btn" data-act="menu" aria-label="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="#0E0E0E" stroke-width="2.4" stroke-linecap="round"><path d="M5 9l7 7 7-7"/></svg></button></div>
    <h1 class="title"><span>Unutma</span><span class="o">Bugün</span></h1>
    <div id="forgets"></div>
  </div></section>

  <!-- FİKİRLER -->
  <section class="page" id="p-fikir" data-i="3"><div class="inner">
    <div class="topbar"><button class="logo" data-act="menu" aria-label="Menü"><img src="apple-touch-icon.png" alt=""></button><div class="dots"><i></i><i></i><i></i><i class="on"></i></div><button class="menu-btn" data-act="menu" aria-label="Menü"><svg viewBox="0 0 24 24" fill="none" stroke="#0E0E0E" stroke-width="2.4" stroke-linecap="round"><path d="M5 9l7 7 7-7"/></svg></button></div>
    <h1 class="title"><span>Fikir</span><span class="g">Defteri</span></h1>
    <div class="chips" id="ideaChips"></div>
    <div id="ideas"></div>
  </div></section>
</main>

<nav id="nav">
  <button data-p="0" class="on">Acil<span class="badge" id="bAcil"></span></button>
  <button data-p="1">İşler</button>
  <button data-p="2">Unutma<span class="badge" id="bUnut"></span></button>
  <button data-p="3">Fikir</button>
</nav>
<button id="fab" aria-label="Ekle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></button>

<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast"><span class="dot"></span><span id="toastMsg"></span><button id="toastBtn"></button></div>

<script>
"use strict";
/* ============ sabitler ============ */
const KEY = "islerGucler.v1";
const CATS = {
  dergi:  {ad:"Dergi",   renk:"var(--pink)"},
  kitap:  {ad:"Kitap",   renk:"var(--blue)"},
  tasarim:{ad:"Tasarım", renk:"var(--mint)"},
  diger:  {ad:"Diğer",   renk:"var(--sun)"}
};
const IDEA_CATS = ["dergi","kitap","tasarim"];
const PRI = {red:{ad:"Acil",n:0}, yellow:{ad:"Sırada",n:1}, green:{ad:"Sakin",n:2}};
const AY = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUN = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const ICONS = {
  dergi:'<svg viewBox="0 0 24 24" fill="none" stroke="#0E0E0E" stroke-width="2" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M8 7h8M8 10.5h8M8 14h4"/><path d="M14 14h2v4h-2z" fill="#0E0E0E"/></svg>',
  kitap:'<svg viewBox="0 0 24 24" fill="none" stroke="#0E0E0E" stroke-width="2" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v13"/></svg>',
  tasarim:'<svg viewBox="0 0 24 24" fill="none" stroke="#0E0E0E" stroke-width="2" stroke-linejoin="round"><path d="M12 3l6 9-6 9-6-9z"/><circle cx="12" cy="12" r="1.8" fill="#0E0E0E"/><path d="M12 3v7.2"/></svg>',
  diger:'<svg viewBox="0 0 24 24" fill="none" stroke="#0E0E0E" stroke-width="2.2" stroke-linecap="round"><path d="M12 4v16M5 8l14 8M19 8L5 16"/></svg>'
};
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#0E0E0E" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ============ yardımcılar ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const up = s => String(s ?? "").toLocaleUpperCase("tr-TR");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, "0");
const dkey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d); };
const timeHTML = t => t ? `<span>${t.slice(0,2)}</span><span class="mm">:${t.slice(3,5)}</span>` : "";
function dayLabel(k){
  if(!k) return null;
  const t = dkey(), d = parseKey(k);
  const tm = new Date(); tm.setDate(tm.getDate()+1);
  const ym = new Date(); ym.setDate(ym.getDate()-1);
  if(k === t) return ["Bugün", AY[d.getMonth()]];
  if(k === dkey(tm)) return ["Yarın", AY[d.getMonth()]];
  if(k === dkey(ym)) return ["Dün", AY[d.getMonth()]];
  return [pad(d.getDate()), AY[d.getMonth()]];
}
const shortDate = ts => { const d = new Date(ts); return `${d.getDate()} ${AY[d.getMonth()]}`; };

/* ============ veri ============ */
const blank = () => ({tasks:[], forgets:[], ideas:[], prefs:{cat:"all", icat:"all"}, updatedAt:0, v:1});
let S = blank();
try { const raw = localStorage.getItem(KEY); if(raw) S = Object.assign(blank(), JSON.parse(raw)); } catch(e){}
S.prefs = Object.assign(blank().prefs, S.prefs || {});

let cloud = null;           // claude db belgesi (varsa)
let saveTimer = null;
function save(){
  S.updatedAt = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(pushCloud, 700);
}
async function pushCloud(){
  if(!cloud) return;
  try { await cloud.set({json: JSON.stringify(S), updatedAt: S.updatedAt}); } catch(e){ console.warn("bulut kaydı başarısız", e); }
}
async function connectCloud(){
  if(!window.claude || typeof window.claude.use !== "function") return;
  const timeout = new Promise(r => setTimeout(() => r(null), 10000));
  try {
    const db = await Promise.race([window.claude.use("db"), timeout]);
    const user = db && await Promise.race([window.claude.use("user"), timeout]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    const ref = db.collection("data/users/" + id).doc("state");
    const snap = await Promise.race([ref.get(), timeout]);
    const data = snap && typeof snap.data === "function" ? snap.data() : snap;
    cloud = ref;
    if(data && data.json && (data.updatedAt || 0) > (S.updatedAt || 0)){
      S = Object.assign(blank(), JSON.parse(data.json));
      S.prefs = Object.assign(blank().prefs, S.prefs || {});
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
      render();
    } else if(S.updatedAt){ pushCloud(); }
  } catch(e){ console.warn("bulut bağlantısı yok", e); }
}

/* ============ sıralama ============ */
function sortTasks(a, b){
  if(PRI[a.pr].n !== PRI[b.pr].n) return PRI[a.pr].n - PRI[b.pr].n;
  const ad = a.due ? a.due + (a.time || "99:99") : "9999";
  const bd = b.due ? b.due + (b.time || "99:99") : "9999";
  if(ad !== bd) return ad < bd ? -1 : 1;
  return b.created - a.created;
}
const urgent = () => S.tasks.filter(t => t.pr === "red" && !t.done).sort(sortTasks);

/* ============ çizim ============ */
function lightsHTML(t){
  return `<div class="lights">${["red","yellow","green"].map(p =>
    `<button class="lt ${p} ${t.pr===p?"on":""}" data-act="pri" data-id="${t.id}" data-pr="${p}" aria-label="${PRI[p].ad}"></button>`).join("")}</div>`;
}
function cardHTML(t){
  const dl = dayLabel(t.due);
  return `<article class="card c-${t.cat} ${t.done?"done":""}" data-act="edit-task" data-id="${t.id}">
    <div class="c-row">
      <div class="box" title="${esc(CATS[t.cat].ad)}">${ICONS[t.cat]}</div>
      <div class="c-body">
        <div class="c-title">${esc(t.title)}</div>
        ${t.note ? `<div class="c-note">${esc(t.note)}</div>` : ""}
      </div>
      <button class="check" data-act="done-task" data-id="${t.id}" aria-label="Tamamlandı">${CHECK}</button>
    </div>
    <div class="c-meta">
      ${t.time ? `<div class="c-time">${timeHTML(t.time)}</div>` : ""}
      <div class="c-day">${dl ? esc(dl[0]) + (/^\d/.test(dl[0]) ? " " + esc(dl[1]) : "") : esc(CATS[t.cat].ad)}</div>
      ${lightsHTML(t)}
    </div>
  </article>`;
}

function renderHub(){
  const u = urgent();
  const today = dkey();
  const fToday = S.forgets.filter(f => f.day === today);
  const fOpen = S.forgets.filter(f => !f.done && f.day <= today);
  const doneToday = S.tasks.filter(t => t.done && t.doneAt && dkey(new Date(t.doneAt)) === today).length + fToday.filter(f => f.done).length;
  const total = u.length + fOpen.length + doneToday;
  const pct = total ? Math.round(doneToday / total * 100) : 0;
  const nextF = fOpen.filter(f => f.time).sort((a,b) => (a.day+a.time) < (b.day+b.time) ? -1 : 1)[0] || fOpen[0];
  const d = new Date();
  const sq = Array.from({length:5}, (_, i) => `<b class="${i < Math.round(pct/20) ? "" : "off"}"></b>`).join("");

  let h = `<div class="stats">
    <div class="stats-head">
      <div class="sub">${esc(up(GUN[d.getDay()]))}<br>${d.getDate()} ${esc(up(AY[d.getMonth()]))}</div>
      <div class="next" data-act="goto" data-p="2" style="cursor:pointer">${nextF
        ? `<small>▸ Unutma</small>${nextF.time ? esc(nextF.time) + " · " : ""}${esc(nextF.text)}`
        : total ? `<small>▸ Bugün</small>%${pct} tamam` : `<small>▸ Bugün</small>Temiz sayfa`}<br><span class="sq">${sq}</span></div>
    </div>
    <div class="bar"><div class="fill" style="width:${Math.max(pct, 4)}%"></div><div class="mid" style="width:${total ? Math.round(u.length/total*100*.6) : 0}%"></div><div class="hatch"></div></div>
    <div class="nums">
      <div><b>${u.length}</b><span>ACİL</span></div>
      <div><b>${fOpen.length}</b><span>UNUTMA</span></div>
      <div><b>${doneToday}</b><span>BİTEN</span></div>
    </div>
  </div>`;

  if(!u.length){
    h += `<div class="empty"><b>Acil iş yok.</b><span>İşler sekmesinde bir işin kırmızı ışığına bastığında burada toplanır.</span></div>`;
  } else {
    const f = u[0], dl = dayLabel(f.due);
    h += `<div class="feat"><div class="feat-in" data-act="edit-task" data-id="${f.id}">
      <div class="feat-head"><span class="tag">ACİL</span>${dl ? esc(dl[0]) + (/^\d/.test(dl[0]) ? " " + esc(dl[1]) : "") : "Tarihsiz"} · ${esc(CATS[f.cat].ad)}</div>
      <div class="feat-mid">
        <div class="box" style="background:${CATS[f.cat].renk}">${ICONS[f.cat]}</div>
        ${f.time ? `<div class="feat-time">${timeHTML(f.time)}</div>` : ""}
        ${lightsHTML(f)}
      </div>
      <div class="feat-title">${esc(f.title)}</div>
      ${f.note ? `<div class="feat-note">${esc(f.note)}</div>` : ""}
    </div><button class="feat-go" data-act="done-task" data-id="${f.id}">Tamamladım ✓</button></div>`;
    if(u.length > 1){
      h += `<div class="sec">Sıradaki acil <span>${u.length - 1}</span></div><div class="stack">${u.slice(1).map(cardHTML).join("")}</div>`;
    }
  }
  $("#hub").innerHTML = h;
  $("#bAcil").textContent = u.length || "";
  $("#bUnut").textContent = fOpen.length || "";
}

function renderTasks(){
  const cat = S.prefs.cat;
  const open = S.tasks.filter(t => !t.done);
  const count = c => open.filter(t => c === "all" || t.cat === c).length;
  $("#catChips").innerHTML = [["all","Tümü"], ...Object.entries(CATS).map(([k,v]) => [k, v.ad])].map(([k, ad]) =>
    `<button class="chip ${cat===k?"on":""}" data-act="cat" data-c="${k}">${k!=="all" ? `<span class="sw" style="background:${CATS[k].renk}"></span>` : ""}${esc(ad)} <i>${count(k)}</i></button>`).join("");
  const list = open.filter(t => cat === "all" || t.cat === cat).sort(sortTasks);
  const done = S.tasks.filter(t => t.done && (cat === "all" || t.cat === cat)).sort((a,b) => b.doneAt - a.doneAt);
  let h = list.length ? `<div class="stack">${list.map(cardHTML).join("")}</div>`
    : `<div class="empty"><b>${cat==="all" ? "Liste boş" : esc(CATS[cat].ad) + " boş"}</b><span>Sağ alttaki + ile yeni iş ekle.</span></div>`;
  if(done.length){
    h += `<div class="sec">Bitenler <button data-act="toggle-done">${S.prefs.showDone ? "Gizle" : "Göster (" + done.length + ")"}</button></div>`;
    if(S.prefs.showDone) h += `<div class="stack">${done.slice(0, 30).map(cardHTML).join("")}</div>`;
  }
  $("#tasks").innerHTML = h;
}

function forgetRow(f){
  const now = new Date(), late = !f.done && f.time && (f.day < dkey() || (f.day === dkey() && f.time < `${pad(now.getHours())}:${pad(now.getMinutes())}`));
  return `<div class="frow ${f.done?"done":""} ${late?"late":""}">
    <div class="ftime ${f.time?"":"none"}">${f.time ? timeHTML(f.time) : "—"}</div>
    <div class="ftext" data-act="edit-forget" data-id="${f.id}">${esc(f.text)}</div>
    <button class="fcheck" data-act="done-forget" data-id="${f.id}" aria-label="Tamam">${CHECK}</button>
  </div>`;
}
function renderForgets(){
  const today = dkey(), d = new Date();
  const todays = S.forgets.filter(f => f.day === today).sort((a,b) => (a.done - b.done) || ((a.time||"99") < (b.time||"99") ? -1 : 1));
  const old = S.forgets.filter(f => f.day < today && !f.done).sort((a,b) => a.day < b.day ? -1 : 1);
  const future = S.forgets.filter(f => f.day > today).sort((a,b) => (a.day+(a.time||"")) < (b.day+(b.time||"")) ? -1 : 1);
  const doneN = todays.filter(f => f.done).length;
  let h = `<div class="today"><div class="sub">${d.getDate()} ${esc(up(AY[d.getMonth()]))} ${esc(up(GUN[d.getDay()]))}</div>
    <div class="prog">${todays.map(f => `<b class="${f.done?"":"off"}"></b>`).join("").slice(0, 2000)}</div></div>`;
  if(old.length) h += `<div class="sec" style="margin-top:4px">Önceden kalan <span>${old.length}</span></div><div class="oldbox">${old.map(forgetRow).join("")}</div>`;
  h += todays.length ? todays.map(forgetRow).join("")
    : `<div class="empty" style="margin-top:6px"><b>Aklında ne var?</b><span>Sağ alttaki yuvarlak + ile gün içinde unutmaman gerekenleri hızlıca yaz.</span></div>`;
  if(future.length) h += `<div class="sec">İleri tarihli <span>${future.length}</span></div>` + future.map(f => {
    const dl = dayLabel(f.day); return forgetRow(f).replace('<div class="ftext"', `<div class="ftext" data-day="${esc(dl[0]+" "+dl[1])}"`).replace(/(<div class="ftext"[^>]*>)/, `$1<small style="margin:0 0 2px">${esc(dl[0])} ${esc(dl[1])}</small>`);
  }).join("");
  if(doneN && todays.length) h += `<p class="hint" style="margin-top:14px">${doneN}/${todays.length} tamam. Biten maddeler ertesi gün kendiliğinden temizlenir.</p>`;
  $("#forgets").innerHTML = h;
}

function renderIdeas(){
  const c = S.prefs.icat;
  const count = k => S.ideas.filter(i => k === "all" || i.cat === k).length;
  $("#ideaChips").innerHTML = [["all","Tümü"], ...IDEA_CATS.map(k => [k, CATS[k].ad])].map(([k, ad]) =>
    `<button class="chip ${c===k?"on":""}" data-act="icat" data-c="${k}">${k!=="all" ? `<span class="sw" style="background:${CATS[k].renk}"></span>` : ""}${esc(ad)} <i>${count(k)}</i></button>`).join("");
  const list = S.ideas.filter(i => c === "all" || i.cat === c).sort((a,b) => b.created - a.created);
  $("#ideas").innerHTML = list.length ? `<div class="ideas">${list.map(i =>
    `<div class="idea c-${i.cat}" data-act="edit-idea" data-id="${i.id}">
      <div class="idea-h">${ICONS[i.cat]}${esc(CATS[i.cat].ad)}</div>
      <p class="${i.text.length <= 38 ? "big" : ""}">${esc(i.text)}</p>
      <time>${shortDate(i.created)}</time>
    </div>`).join("")}</div>`
    : `<div class="empty"><b>Fikir yok… henüz.</b><span>+ ile yaz, dergi mi kitap mı tasarım mı olduğunu seç.</span></div>`;
}

function render(){ renderHub(); renderTasks(); renderForgets(); renderIdeas(); }

/* ============ sayfalar ============ */
const pager = $("#pager");
const PAGE_BG = ["#F5C8E7", "#FFFFFF", "#FFFFFF", "#FFFFFF"];
let cur = 0;
function setPage(i){
  cur = i;
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", +b.dataset.p === i));
  document.body.style.background = PAGE_BG[i];
  $("#themeColor").setAttribute("content", PAGE_BG[i]);
  $("#fab").classList.toggle("orange", i === 0);
  try { history.replaceState(null, "", "#" + ["acil","isler","unutma","fikirler"][i]); } catch(e){}
}
function goto(i, smooth = true){ pager.scrollTo({left: i * pager.clientWidth, behavior: smooth ? "smooth" : "auto"}); setPage(i); }
let st;
pager.addEventListener("scroll", () => { clearTimeout(st); st = setTimeout(() => {
  const i = Math.round(pager.scrollLeft / pager.clientWidth); if(i !== cur) setPage(i); }, 60); }, {passive:true});
window.addEventListener("resize", () => pager.scrollTo({left: cur * pager.clientWidth}));
document.querySelectorAll("#nav button").forEach(b => b.addEventListener("click", () => goto(+b.dataset.p)));

/* ============ toast ============ */
let toastT;
function toast(msg, btn, fn, dot = "var(--r-red)"){
  $("#toastMsg").textContent = msg; $("#toastBtn").textContent = btn || "";
  $("#toast .dot").style.background = dot;
  $("#toastBtn").onclick = () => { $("#toast").classList.remove("on"); fn && fn(); };
  $("#toast").classList.add("on"); clearTimeout(toastT);
  toastT = setTimeout(() => $("#toast").classList.remove("on"), btn ? 4500 : 2200);
}

/* ============ sheet ============ */
function openSheet(html, mount){
  $("#sheet").innerHTML = `<div class="grab"></div>` + html;
  $("#scrim").classList.add("on"); $("#sheet").classList.add("on"); $("#sheet").scrollTop = 0;
  mount && mount($("#sheet"));
}
function closeSheet(){ $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); document.activeElement && document.activeElement.blur(); }
$("#scrim").addEventListener("click", closeSheet);
// aşağı sürükleyerek kapat
(() => { let y0 = null; const sh = $("#sheet");
  sh.addEventListener("touchstart", e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive:true});
  sh.addEventListener("touchmove", e => { if(y0 === null) return; const dy = e.touches[0].clientY - y0; if(dy > 0){ sh.style.transition = "none"; sh.style.transform = `translateY(${dy}px)`; } }, {passive:true});
  sh.addEventListener("touchend", e => { if(y0 === null) return; const dy = e.changedTouches[0].clientY - y0; sh.style.transition = ""; sh.style.transform = ""; if(dy > 110) closeSheet(); y0 = null; });
})();

function defaultReminderTime(){ const d = new Date(); d.setMinutes(0, 0, 0); d.setHours(d.getHours() + 1); return d; }

      save(); render(); closeSheet();
      if(data.pr === "red" && !wasRed) toast("Acil Merkez'e gitti", cur !== 0 ? "Git" : "", () => goto(0));
      else toast(isNew ? "Eklendi" : "Kaydedildi", "", null, "var(--r-grn)");
    };

}

function forgetSheet(f){
  const isNew = !f;
  f = f || {id:null, text:"", time:"", day:dkey()};
  const st = {time:f.time};
  const plus1 = defaultReminderTime(), p1 = `${pad(plus1.getHours())}:00`;
  const presets = [["", "Saatsiz"], [p1, "+1 saat"], ["12:30","12:30"], ["18:00","18:00"], ["21:00","21:00"]];
  openSheet(`<h2 class="sh-title">${isNew ? "Unutma<br><span>bunu</span>" : "Düzenle"}</h2>
    <input class="field" id="uText" placeholder="Örn. Matbaayı ara" value="${esc(f.text)}" enterkeyhint="done" autocomplete="off">
    <div class="lbl">Ne zaman</div>
    <div class="chiprow" id="uTimes">${presets.map(([v,l]) => `<button class="tchip ${st.time===v?"on":""}" data-v="${v}">${l}</button>`).join("")}
      <input class="field" type="time" id="uTime" value="${esc(f.time)}" style="width:auto;flex:1;min-width:120px;padding:9px 12px">
    </div>
    <div class="row" style="margin-top:4px"><div><div class="lbl">Gün</div><input class="field" type="date" id="uDay" value="${esc(f.day)}"></div></div>
    <button class="btn" id="uSave">${isNew ? "Kaydet" : "Kaydet"}</button>

    const inp = sh.querySelector("#uText"), ti = sh.querySelector("#uTime");
    if(isNew) setTimeout(() => inp.focus(), 330);
    const mark = () => sh.querySelectorAll("#uTimes .tchip").forEach(b => b.classList.toggle("on", b.dataset.v === st.time));
    sh.querySelector("#uTimes").onclick = e => { const b = e.target.closest(".tchip"); if(!b) return; st.time = b.dataset.v; ti.value = st.time; mark(); };
    ti.oninput = () => { st.time = ti.value; mark(); };
    const doSave = () => {
      const text = inp.value.trim(); if(!text){ inp.focus(); return; }
      const day = sh.querySelector("#uDay").value || dkey();
      let item;
      if(isNew){ item = {id:uid(), text, time:st.time, day, done:false, created:Date.now()}; S.forgets.push(item); }
      else { item = S.forgets.find(z => z.id === f.id); Object.assign(item, {text, time:st.time, day}); }
      save(); render(); closeSheet();
      toast("Not alındı", "", null, "var(--r-grn)");

    sh.querySelector("#uSave").onclick = doSave;

    <div class="row" id="iCat">${IDEA_CATS.map(k => `<button class="opt big c-${k} ${st.cat===k?"on":""}" data-v="${k}">${ICONS[k]}${esc(CATS[k].ad)}</button>`).join("")}</div>
    <button class="btn" id="iSave" ${st.cat ? "" : "disabled"}>${isNew ? "Kaydet" : "Kaydet"}</button>
    ${isNew ? "" : `<div class="btns2"><button class="btn alt" data-act="idea-task" data-id="${i.id}">İşe dönüştür</button><button class="btn alt" data-act="del-idea" data-id="${i.id}">Sil</button></div>`}
    <button class="btn ghost" data-act="close">Vazgeç</button>`, sh => {
    const ta = sh.querySelector("#iText"), sv = sh.querySelector("#iSave");
    if(isNew) setTimeout(() => ta.focus(), 330);
    sh.querySelector("#iCat").onclick = e => { const b = e.target.closest(".opt"); if(!b) return; st.cat = b.dataset.v; sh.querySelectorAll("#iCat .opt").forEach(x => x.classList.toggle("on", x === b)); sv.disabled = false; };
    sv.onclick = () => {
      const text = ta.value.trim(); if(!text){ ta.focus(); return; } if(!st.cat) return;
      if(isNew) S.ideas.push({id:uid(), text, cat:st.cat, created:Date.now()});
      else Object.assign(S.ideas.find(z => z.id === i.id), {text, cat:st.cat});
      save(); render(); closeSheet(); toast("Fikir kaydedildi", "", null, "var(--r-grn)");
    };
  });
}

function menuSheet(){
  const n = S.tasks.length + S.forgets.length + S.ideas.length;
  openSheet(`<h2 class="sh-title">İşler<br><span>Güçler</span></h2>
    <div class="menu-list">
      <button data-act="backup">Yedek al <span>Tüm verileri dosya olarak kaydeder</span></button>
      <button data-act="restore">Yedekten yükle <span>Yedek dosyasını ya da metni geri yükler</span></button>
      <button data-act="clean">Bitenleri temizle <span>Tamamlanan işleri siler</span></button>
    </div>
    <p class="note">${n} kayıt. ${cloud ? "Verilerin Claude hesabında saklanıyor; başka cihazdan açtığında da görünür." : "Verilerin bu cihazda saklanıyor. Ara sıra yedek almanı öneririm."}</p>
    <button class="btn ghost" data-act="close">Kapat</button>`);
}

/* ============ yedek ============ */
async function backup(){
  const txt = JSON.stringify(S, null, 1);
  const name = `isler-gucler-yedek-${dkey()}.json`;
  try {
    const file = new File([txt], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"İşler Güçler yedeği"});
      toast("Yedek hazır", "", null, "var(--r-grn)"); return;
    }
  } catch(err){ if(err && err.name === "AbortError") return; }
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([txt], {type:"application/json"})); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast("Yedek indirildi", "", null, "var(--r-grn)");
  } catch(err){}
  try { await navigator.clipboard.writeText(txt); } catch(err){}
}

/* ============ eylemler ============ */
function setPri(id, pr, el){
  const t = S.tasks.find(x => x.id === id); if(!t || t.pr === pr) return;
  const old = t.pr; t.pr = pr; save();
  if(pr === "red"){
    if(el){ el.classList.add("pop"); }
    setTimeout(render, 200);
    toast("Acil Merkez'e gitti", cur !== 0 ? "Git" : "", () => goto(0));
  } else {
    render();
    if(old === "red") toast("Acil'den çıktı", "Geri al", () => { t.pr = old; save(); render(); }, pr === "yellow" ? "var(--r-yel)" : "var(--r-grn)");
  }
}
function toggleDone(id){
  const t = S.tasks.find(x => x.id === id); if(!t) return;
  t.done = !t.done; t.doneAt = t.done ? Date.now() : null; save(); render();
  if(t.done) toast("Bitti, aferin", "Geri al", () => { t.done = false; t.doneAt = null; save(); render(); }, "var(--r-grn)");
}
function removeWithUndo(arr, id, msg){
  const idx = S[arr].findIndex(x => x.id === id); if(idx < 0) return;
  const [it] = S[arr].splice(idx, 1); save(); render(); closeSheet();
  toast(msg, "Geri al", () => { S[arr].splice(idx, 0, it); save(); render(); }, "#999");
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if(!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if(a !== "edit-task" && a !== "edit-forget" && a !== "edit-idea") e.stopPropagation();
  switch(a){
    case "pri": e.stopPropagation(); setPri(id, el.dataset.pr, el); return;
    case "done-task": closeSheet(); toggleDone(id); return;
    case "edit-task": if(e.target.closest(".lt,.check")) return; taskSheet(S.tasks.find(x => x.id === id)); return;
    case "del-task": removeWithUndo("tasks", id, "İş silindi"); return;
    case "cat": S.prefs.cat = el.dataset.c; save(); renderTasks(); return;
    case "icat": S.prefs.icat = el.dataset.c; save(); renderIdeas(); return;
    case "toggle-done": S.prefs.showDone = !S.prefs.showDone; save(); renderTasks(); return;
    case "done-forget": { const f = S.forgets.find(x => x.id === id); f.done = !f.done; f.doneAt = f.done ? Date.now() : null; save(); render(); return; }
    case "edit-forget": forgetSheet(S.forgets.find(x => x.id === id)); return;
    case "del-forget": removeWithUndo("forgets", id, "Silindi"); return;
    case "edit-idea": ideaSheet(S.ideas.find(x => x.id === id)); return;
    case "del-idea": removeWithUndo("ideas", id, "Fikir silindi"); return;
    case "idea-task": { const i = S.ideas.find(x => x.id === id);
      S.tasks.push({id:uid(), title:i.text.slice(0, 140), cat:i.cat, pr:"yellow", due:"", time:"", note:"Fikirden", created:Date.now(), done:false});
      save(); render(); closeSheet(); S.prefs.cat = i.cat; renderTasks(); goto(1); toast("İş olarak eklendi", "", null, "var(--r-yel)"); return; }
    case "goto": goto(+el.dataset.p); return;
    case "menu": menuSheet(); return;
    case "close": closeSheet(); return;
    case "backup": backup(); return;
    case "restore":
      openSheet(`<h2 class="sh-title">Yedekten<br><span>yükle</span></h2>
        <label class="btn alt" style="margin-top:0;cursor:pointer">Yedek dosyası seç<input type="file" id="rFile" accept=".json,application/json,text/plain" hidden></label>
        <div class="lbl">ya da yapıştır</div>
        <textarea class="field" id="rTxt" rows="5" placeholder="Yedeği buraya yapıştır"></textarea>
        <p class="note">Yükleme mevcut verilerin yerine geçer.</p>
        <button class="btn" id="rGo">Yükle</button><button class="btn ghost" data-act="close">Vazgeç</button>`, sh => {
        sh.querySelector("#rFile").onchange = async ev => { const f = ev.target.files[0]; if(f){ sh.querySelector("#rTxt").value = await f.text(); } };
        sh.querySelector("#rGo").onclick = () => {
          try { const d = JSON.parse(sh.querySelector("#rTxt").value); if(!Array.isArray(d.tasks)) throw 0;
            S = Object.assign(blank(), d); S.prefs = Object.assign(blank().prefs, S.prefs || {}); save(); render(); closeSheet(); toast("Yedek yüklendi", "", null, "var(--r-grn)");
          } catch(err){ toast("Bu bir yedek değil gibi"); }
        };
      });
      return;
    case "clean": { const before = S.tasks.length; S.tasks = S.tasks.filter(t => !t.done); save(); render(); closeSheet(); toast(`${before - S.tasks.length} iş temizlendi`, "", null, "var(--r-grn)"); return; }
  }
});

$("#fab").addEventListener("click", () => {
  if(cur === 2) forgetSheet();
  else if(cur === 3) ideaSheet();
  else taskSheet();
});

/* ============ bakım ============ */
function housekeep(){
  const today = dkey(), monthAgo = Date.now() - 30*864e5;
  // tamamlanmış "unutma"lar ertesi gün temizlenir
  S.forgets = S.forgets.filter(f => !(f.done && f.day < today));
  delete S.prefs.rem; S.forgets.forEach(f => { delete f.sent; });
  S.tasks = S.tasks.filter(t => !(t.done && t.doneAt && t.doneAt < monthAgo)); // 30 günden eski bitenler
}

/* ============ başlat ============ */
housekeep();
render();
const startHash = ["acil","isler","unutma","fikirler"].indexOf((location.hash || "").slice(1));
requestAnimationFrame(() => goto(Math.max(0, startHash), false));
connectCloud();
document.addEventListener("visibilitychange", () => { if(!document.hidden){ housekeep(); render(); } });
setInterval(() => { if(!document.hidden) renderForgets(); }, 60000);
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){ navigator.serviceWorker.register("sw.js").catch(() => {}); }
</script>
